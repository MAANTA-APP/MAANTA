name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# SEC-012. Declared explicitly rather than inheriting the org default, which can
# be broader than this job needs. CI only reads the checkout and runs checks —
# it never comments, pushes or publishes. prod-branch-guard.yml and e2e.yml
# already declared this; ci.yml was the one that did not.
permissions:
  contents: read

defaults:
  run:
    working-directory: maanta-app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maanta-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The Clerk-strategy smoke leg. Every other check runs the Supabase
      # default, so the branch production actually executes — real env-var
      # strategy resolution plus the Clerk server-client shape — was never
      # exercised in CI. That gap shipped two production failures (D70 and the
      # 2026-08-14 client-construction P0, PR #203). The suite sets the Clerk
      # env vars itself, so it also runs inside `npm run test`; this named step
      # exists so a Clerk-path failure is visible as its own line rather than
      # buried in the full run.
      - name: Clerk-strategy smoke
        run: npm run test:clerk-smoke

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — this app never talks to these
          # services at build time, but the module-load-time env checks in
          # src/lib/supabase/*.ts and src/lib/stripe.ts throw if unset.
          # Real values live in the deploy target's env config, not here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          # Default auth strategy is supabase; Clerk keys only needed for clerk launch builds.
          MAANTA_AUTH_STRATEGY: supabase
          NEXT_PUBLIC_MAANTA_AUTH_STRATEGY: supabase
          # Clerk wraps pages when strategy=clerk; placeholder key for prerender safety.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_placeholder

  # Boots a local Supabase (Postgres + postgis + auth schema + roles), applies
  # every migration in supabase/migrations/, then runs the plain-SQL assertion
  # suites in supabase/tests/*.sql. Each test file ends in a RAISE NOTICE on
  # success and ASSERTs (which abort psql under ON_ERROR_STOP) on failure, so a
  # broken migration or rule regression fails the job.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to avoid GitHub API rate limits when resolving `latest`.
          version: 2.109.1

      - name: Start Supabase (applies supabase/migrations/)
        run: supabase start

      - name: Run supabase/tests/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          ran=0
          for f in supabase/tests/*.sql; do
            ran=1
            echo "::group::$f"
            # Capture psql's output so a failure can be reported somewhere
            # readable. Until this existed, a failing suite produced only
            # "Process completed with exit code 3" in the annotations, and the
            # actual `ERROR:` line lived solely in the raw log — which is behind
            # a storage redirect that is not always reachable. Diagnosing a red
            # board then meant re-running it locally, which is exactly what the
            # people most likely to break this job cannot do.
            if ! psql "$db_url" -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee /tmp/psql-out.txt; then
              echo "::endgroup::"
              echo "::error file=$f::SQL suite failed — see the job summary for the psql error"
              {
                echo "### ❌ \`$f\`"
                echo
                echo '```'
                # The ERROR/CONTEXT/DETAIL lines are what actually name the
                # defect; the NOTICEs above them say how far the suite got.
                grep -E '^(psql:|ERROR|DETAIL|HINT|CONTEXT|NOTICE)' /tmp/psql-out.txt | tail -40 \
                  || tail -40 /tmp/psql-out.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::endgroup::"
          done
          if [ "$ran" = "0" ]; then echo "No SQL tests found under supabase/tests/"; fi

      - name: Stop Supabase
        if: always()
        run: command -v supabase >/dev/null && supabase stop || true
