name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: maanta-app

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maanta-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Layer 1 of the design-truth contract (design/current-reality/README.md).
      # Pure and filesystem-only, so it runs on every PR: it fails when a frame
      # points at a route or file that no longer exists, when a runtime rule or
      # drift id does not resolve, or when the smoke spec stops being generated
      # from the contract. Run before the full suite so a lying mirror is the
      # first thing a reviewer sees, not a needle in 300 passing tests.
      # Layer 2 (npm run test:design-truth:smoke) needs a seeded non-prod env
      # and runs from e2e.yml, not here.
      - name: Design-truth contract (Layer 1)
        run: npm run test:design-truth

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — this app never talks to these
          # services at build time, but the module-load-time env checks in
          # src/lib/supabase/*.ts and src/lib/stripe.ts throw if unset.
          # Real values live in the deploy target's env config, not here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          # Clerk wraps every page via <ClerkProvider>, which needs a
          # well-formed publishable key even to prerender the marketing pages.
          # This dummy decodes to "placeholder.clerk.accounts.dev$" — no real
          # instance is contacted at build time.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA==
          CLERK_SECRET_KEY: sk_test_placeholder

  # Boots a local Supabase (Postgres + postgis + auth schema + roles), applies
  # every migration in supabase/migrations/, then runs the plain-SQL assertion
  # suites in supabase/tests/*.sql. Each test file ends in a RAISE NOTICE on
  # success and ASSERTs (which abort psql under ON_ERROR_STOP) on failure, so a
  # broken migration or rule regression fails the job.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin to avoid GitHub API rate limits when resolving `latest`.
          version: 2.109.1

      - name: Start Supabase (applies supabase/migrations/)
        run: supabase start

      - name: Run supabase/tests/*.sql
        run: |
          set -euo pipefail
          shopt -s nullglob
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          ran=0
          for f in supabase/tests/*.sql; do
            ran=1
            echo "::group::$f"
            psql "$db_url" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          if [ "$ran" = "0" ]; then echo "No SQL tests found under supabase/tests/"; fi

      - name: Stop Supabase
        if: always()
        run: command -v supabase >/dev/null && supabase stop || true
