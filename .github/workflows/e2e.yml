name: E2E (Playwright golden path)

# Browser-visible golden-path suite (Definition of Done §8). It needs a live
# TEST Supabase + Clerk instance and a seeded /demo, so it is NOT part of the
# required `ci.yml` gate. Run it on demand now; flip `on:` to `pull_request`
# once the secrets below exist in the repo.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]

defaults:
  run:
    working-directory: maanta-app

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Skip cleanly if the live test env isn't configured yet, instead of failing.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      CI: "true"
      # App under test — a deployed preview, or leave unset to boot `next start`.
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      # Supabase (TEST project).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      # Clerk (TEST instance).
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /select-mall
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /select-mall
      # Seeded logins — Clerk TEST users (see docs/skills/e2e-playwright-golden-path.md).
      E2E_SHOPPER_EMAIL: ${{ vars.E2E_SHOPPER_EMAIL }}
      E2E_MERCHANT_NUUR_EMAIL: ${{ vars.E2E_MERCHANT_NUUR_EMAIL }}
      E2E_MERCHANT_BILAN_EMAIL: ${{ vars.E2E_MERCHANT_BILAN_EMAIL }}
      E2E_OTP_CODE: ${{ secrets.E2E_OTP_CODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maanta-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Only needed when E2E_BASE_URL is unset (config boots `next start`).
      - name: Build
        if: ${{ vars.E2E_BASE_URL == '' }}
        run: npm run build

      - name: Run Playwright golden-path suite
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: maanta-app/playwright-report
          retention-days: 14
