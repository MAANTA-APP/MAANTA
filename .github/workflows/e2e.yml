name: E2E (golden path)

# Opt-in browser golden-path suite (tracker E14 / PR #35). It runs against a
# DEPLOYED app and needs a live Supabase + Clerk test env + storage-state
# secrets, so it is gated on a repository variable and stays OFF until an
# operator provisions it — the main CI (lint/typecheck/vitest/build/db-tests)
# is unaffected.
#
# Trigger posture (security): this suite runs POST-MERGE on `main` and on-demand
# via `workflow_dispatch` — deliberately NOT on `pull_request`, so the
# storage-state secrets are never exposed to a PR-triggered run. Per-PR
# verification is a manual dispatch.
#
# To enable (human/ops task, see docs/ops/e2e-golden-path.md):
#   1. Repo Settings → Environments: create an environment named `e2e` and add
#      required reviewers (so the secret-bearing job needs approval to run).
#   2. Repo Settings → Secrets and variables → Actions:
#        - Variable  E2E_BASE_URL            = https://<deployed NON-PROD app>
#        - Env secrets (on the `e2e` environment) E2E_SHOPPER_STORAGE,
#          E2E_MERCHANT_STORAGE                = Playwright storageState JSON
#   3. Without E2E_BASE_URL the job is a no-op (the `if` below is false), so it
#      never runs prematurely.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs against the shared, mutable E2E backend: the suite verifies
# real redemptions against seeded deals + a merchant wallet, so concurrent runs
# would race that state. Don't cancel an in-flight (paid) redemption run.
concurrency:
  group: e2e-golden-path-${{ vars.E2E_BASE_URL }}
  cancel-in-progress: false

# Least privilege: the job only needs to read the repo to run tests.
permissions:
  contents: read

defaults:
  run:
    working-directory: maanta-app

jobs:
  e2e:
    # Gate: runs only once E2E_BASE_URL is set, AND only on main — so a manual
    # `workflow_dispatch` can't run arbitrary branch code with the E2E secrets.
    if: ${{ vars.E2E_BASE_URL != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Bind to a protected Environment so the storage-state secrets are gated
    # behind required-reviewer approval (configured in repo Settings). The
    # secrets below resolve from this environment.
    environment: e2e
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      # Fail closed on a production (or unknown) target BEFORE any checkout or
      # install. This suite performs real redemptions and charges the KES 30
      # fee, so it must never run against prod even if E2E_BASE_URL is
      # misconfigured. Blocks the production host and, when the optional
      # E2E_ALLOWED_HOST repo variable is set, enforces a positive allowlist.
      - name: Guard the E2E target (non-prod only)
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ALLOWED_HOST: ${{ vars.E2E_ALLOWED_HOST }}
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            *maanta.app*)
              echo "::error::E2E_BASE_URL points at a production host (maanta.app) — refusing; this suite charges real KES 30 fees. Use a dedicated non-prod deployment."
              exit 1 ;;
          esac
          if [ -n "${E2E_ALLOWED_HOST:-}" ] && [ "${E2E_BASE_URL#*"$E2E_ALLOWED_HOST"}" = "$E2E_BASE_URL" ]; then
            echo "::error::E2E_BASE_URL ($E2E_BASE_URL) is not in the approved non-prod allowlist (E2E_ALLOWED_HOST=$E2E_ALLOWED_HOST)."
            exit 1
          fi
          echo "E2E target OK: $E2E_BASE_URL"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maanta-app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      # Playwright is intentionally not in package.json (keeps `npm ci` lockfile
      # valid for the main build); install it just for this job.
      - name: Install Playwright + Chromium
        run: |
          npm i -D --no-save @playwright/test
          npx playwright install --with-deps chromium

      # The storage-state secrets are exposed ONLY to the two steps that need
      # them (this preflight + the test run) — not job-wide — so checkout and
      # the installs above can't read them.
      - name: Require storage states (fail a zero-coverage run)
        env:
          E2E_SHOPPER_STORAGE: ${{ secrets.E2E_SHOPPER_STORAGE }}
          E2E_MERCHANT_STORAGE: ${{ secrets.E2E_MERCHANT_STORAGE }}
        run: |
          if [ -z "$E2E_SHOPPER_STORAGE" ] || [ -z "$E2E_MERCHANT_STORAGE" ]; then
            echo "::error::E2E_BASE_URL is set but a storage secret is missing — the suite would self-skip to a green zero-coverage run. Set E2E_SHOPPER_STORAGE and E2E_MERCHANT_STORAGE on the e2e environment."
            exit 1
          fi

      - name: Run golden-path E2E
        env:
          E2E_SHOPPER_STORAGE: ${{ secrets.E2E_SHOPPER_STORAGE }}
          E2E_MERCHANT_STORAGE: ${{ secrets.E2E_MERCHANT_STORAGE }}
        run: npm run test:e2e

  # Layer 2 of the design-truth contract: one browser check per `smoke: true`
  # frame, generated from design/current-reality/frames.json. Separate from the
  # golden path because it needs the FULL test-role set (six accounts) and four
  # seed rows, not just shopper + merchant. Layer 1 runs on every PR in ci.yml.
  #
  # To enable, in addition to the golden-path setup above:
  #   Variable E2E_DESIGN_TRUTH = true
  #   Env secrets on `e2e`: E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE,
  #     E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY, E2E_STORAGE_AGENT, E2E_STORAGE_ADMIN
  #     (shopper and merchant reuse E2E_SHOPPER_STORAGE / E2E_MERCHANT_STORAGE)
  #   Env secrets for the seed rows: E2E_SEED_DEAL_ID, E2E_SEED_TICKET_ID,
  #     E2E_SEED_LEAD_ID, E2E_SEED_HELD_REDEMPTION_ID
  design-truth-smoke:
    if: ${{ vars.E2E_BASE_URL != '' && vars.E2E_DESIGN_TRUTH == 'true' && github.ref == 'refs/heads/main' }}
    # Runs after the golden path, not beside it: both drive the same mutable
    # backend, and a redemption completing mid-navigation would flake the smoke
    # assertions for no useful signal.
    needs: e2e
    runs-on: ubuntu-latest
    environment: e2e
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - name: Guard the E2E target (non-prod only)
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_ALLOWED_HOST: ${{ vars.E2E_ALLOWED_HOST }}
        run: |
          set -euo pipefail
          case "$E2E_BASE_URL" in
            *maanta.app*)
              echo "::error::E2E_BASE_URL points at a production host (maanta.app) — refusing. Smoke drives admin and founder ops surfaces."
              exit 1 ;;
          esac
          if [ -n "${E2E_ALLOWED_HOST:-}" ] && [ "${E2E_BASE_URL#*"$E2E_ALLOWED_HOST"}" = "$E2E_BASE_URL" ]; then
            echo "::error::E2E_BASE_URL ($E2E_BASE_URL) is not in the approved non-prod allowlist (E2E_ALLOWED_HOST=$E2E_ALLOWED_HOST)."
            exit 1
          fi
          echo "E2E target OK: $E2E_BASE_URL"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: maanta-app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm i -D --no-save @playwright/test
          npx playwright install --with-deps chromium

      # The spec itself throws `missing test role: <role>` for an absent account,
      # so a partial run fails rather than covering 9 of 14 frames in green. This
      # step is the earlier, clearer version of the same failure.
      - name: Require the full role set and seed rows
        env:
          E2E_STORAGE_SHOPPER: ${{ secrets.E2E_SHOPPER_STORAGE }}
          E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE: ${{ secrets.E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE }}
          E2E_STORAGE_MERCHANT: ${{ secrets.E2E_MERCHANT_STORAGE }}
          E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY: ${{ secrets.E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY }}
          E2E_STORAGE_AGENT: ${{ secrets.E2E_STORAGE_AGENT }}
          E2E_STORAGE_ADMIN: ${{ secrets.E2E_STORAGE_ADMIN }}
          E2E_SEED_DEAL_ID: ${{ secrets.E2E_SEED_DEAL_ID }}
          E2E_SEED_TICKET_ID: ${{ secrets.E2E_SEED_TICKET_ID }}
          E2E_SEED_LEAD_ID: ${{ secrets.E2E_SEED_LEAD_ID }}
          E2E_SEED_HELD_REDEMPTION_ID: ${{ secrets.E2E_SEED_HELD_REDEMPTION_ID }}
        run: |
          set -euo pipefail
          missing=""
          for v in E2E_STORAGE_SHOPPER E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE \
                   E2E_STORAGE_MERCHANT E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY \
                   E2E_STORAGE_AGENT E2E_STORAGE_ADMIN \
                   E2E_SEED_DEAL_ID E2E_SEED_TICKET_ID E2E_SEED_LEAD_ID \
                   E2E_SEED_HELD_REDEMPTION_ID; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::design-truth smoke is enabled but these are unset:$missing — a partial run would report coverage it does not have."
            exit 1
          fi
          echo "All roles and seed rows present."

      - name: Run design-truth smoke (Layer 2)
        env:
          E2E_STORAGE_SHOPPER: ${{ secrets.E2E_SHOPPER_STORAGE }}
          E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE: ${{ secrets.E2E_STORAGE_SHOPPER_UNVERIFIED_PHONE }}
          E2E_STORAGE_MERCHANT: ${{ secrets.E2E_MERCHANT_STORAGE }}
          E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY: ${{ secrets.E2E_STORAGE_MERCHANT_STAFF_NO_VERIFY }}
          E2E_STORAGE_AGENT: ${{ secrets.E2E_STORAGE_AGENT }}
          E2E_STORAGE_ADMIN: ${{ secrets.E2E_STORAGE_ADMIN }}
          E2E_SEED_DEAL_ID: ${{ secrets.E2E_SEED_DEAL_ID }}
          E2E_SEED_TICKET_ID: ${{ secrets.E2E_SEED_TICKET_ID }}
          E2E_SEED_LEAD_ID: ${{ secrets.E2E_SEED_LEAD_ID }}
          E2E_SEED_HELD_REDEMPTION_ID: ${{ secrets.E2E_SEED_HELD_REDEMPTION_ID }}
        run: npm run test:design-truth:smoke
