# Supabase CLI config for local development and CI.
#
# `supabase start` boots a local Postgres (with postgis, the auth schema,
# the anon/authenticated/service_role roles, etc.) and applies everything in
# supabase/migrations/. CI then runs the plain-SQL assertions in
# supabase/tests/*.sql against it (see .github/workflows/ci.yml, job db-tests).
#
# Only the essentials are pinned here; the CLI fills defaults for the rest.
# Production runs Postgres 17, so the local/CI database matches it.
project_id = "maanta"

[db]
port = 54322
major_version = 17

# Clerk as a Supabase third-party auth provider (see docs/skills/clerk-auth.md).
# Mirrors the hosted-project setting so `supabase start` / CI trust the same
# Clerk-issued JWTs prod does. The Clerk instance ("cheerful-sailfish-3") must
# still be configured for Supabase compatibility in the Clerk dashboard
# (https://dashboard.clerk.com/setup/supabase) so its session tokens carry the
# `role: authenticated` claim.
[auth.third_party.clerk]
enabled = true
domain = "cheerful-sailfish-3.clerk.accounts.dev"
